version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: absensi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: absensi_sekolah
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absensi-network

  backend:
    build: .
    container_name: absensi_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: absensi_sekolah
      APP_PORT: 8080
      JWT_SECRET: dev-secret-key-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - absensi-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  absensi-network:
    driver: bridge
